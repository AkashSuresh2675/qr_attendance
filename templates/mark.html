<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - My QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body class="min-h-screen bg-slate-50 font-['Inter'] text-slate-800">

    <!-- Top Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-100 p-2 rounded-lg">
                        <span class="text-xl">📱</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-slate-900 leading-tight">My QR Code</h1>
                        <p class="text-xs font-medium text-slate-500" id="studentSessionDisplay">Present to Teacher</p>
                    </div>
                </div>
                <button id="logoutBtn"
                    class="bg-red-50 text-red-600 hover:bg-red-100 font-medium py-2 px-4 rounded-lg transition-colors duration-200 text-sm border border-red-100">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-4 py-8">
        <!-- Main Card Container -->
        <div
            class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden transform transition-all duration-300 hover:shadow-2xl hover:shadow-indigo-100/50 bounce-in">

            <div class="p-6 sm:p-8">
                <form id="studentQrForm" class="space-y-5">
                    <div>
                        <label for="qrStudentName" class="block text-sm font-semibold text-slate-700 mb-1.5">Full
                            Name</label>
                        <input type="text" id="qrStudentName" placeholder="e.g. John Doe" required autocomplete="off"
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 font-medium placeholder:font-normal placeholder:text-slate-400">
                    </div>

                    <div>
                        <label for="qrStudentRoll" class="block text-sm font-semibold text-slate-700 mb-1.5">Roll
                            Number</label>
                        <input type="text" id="qrStudentRoll" placeholder="e.g. 101" required autocomplete="off"
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 font-medium placeholder:font-normal placeholder:text-slate-400">
                    </div>

                    <div>
                        <label for="qrStudentClass"
                            class="block text-sm font-semibold text-slate-700 mb-1.5">Class/Section</label>
                        <input type="text" id="qrStudentClass" placeholder="e.g. CS-A" required autocomplete="off"
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 font-medium placeholder:font-normal placeholder:text-slate-400">
                    </div>

                    <button type="submit" id="generateQrBtn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-200 transform transition-all duration-200 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 mt-2">
                        Update & Generate QR
                    </button>
                </form>

                <div id="statusMessage"
                    class="hidden mt-4 p-4 rounded-xl text-center font-medium text-sm status-message"></div>
            </div>

            <!-- QR Display Section -->
            <div id="qrOutputContainer"
                class="hidden border-t border-slate-100 bg-slate-50 p-8 text-center qr-container">
                <h3 class="font-bold text-slate-800 mb-6">Scan at the Teacher's Desk</h3>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 inline-block">
                    <div id="studentQrcode" class="mx-auto flex justify-center"></div>
                </div>
                <div
                    class="mt-6 flex items-center justify-center gap-2 text-indigo-600 font-medium text-sm animate-pulse">
                    <span class="relative flex h-3 w-3">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                    </span>
                    Ready to scan
                </div>
            </div>

        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initStudentView === 'function') {
                initStudentView();
            }
        });
    </script>
</body>

</html>
