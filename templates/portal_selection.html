<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .portal-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        form {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        button[value="teacher"] {
            background-color: #3498db;
            color: white;
        }

        button[value="teacher"]:hover {
            background-color: #2980b9;
        }

        button[value="student"] {
            background-color: #2ecc71;
            color: white;
        }

        button[value="student"]:hover {
            background-color: #27ae60;
        }

        button[value="admin"] {
            background-color: #e74c3c;
            color: white;
        }

        button[value="admin"]:hover {
            background-color: #c0392b;
        }

        .user-info {
            margin-bottom: 25px;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Select Your Portal</h1>
        <div class="user-info">
            Logged in as: <strong>{{ session.get('name', 'User') }}</strong><br>
            ({{ session.get('email', '') }})
        </div>

        <form action="/select_portal" method="POST" class="portal-options">
            <button type="submit" name="role" value="teacher">Teacher Portal</button>
            <button type="submit" name="role" value="student">Student Portal</button>
            <button type="submit" name="role" value="admin">Admin Portal</button>
        </form>
    </div>
</body>

</html>
