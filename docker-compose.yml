version: "3.8"
services:
  app:
    image: ${DOCKER_USERNAME}/qr-attendance:latest
    container_name: qr-attendance-app
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      # Mount the database to persist data between deployments
      - ./attendance.db:/app/attendance.db
    networks:
      - webnet
  nginx:
    image: nginx:alpine
    container_name: qr-attendance-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
