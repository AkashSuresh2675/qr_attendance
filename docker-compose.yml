version: "3.8"
services:
  app:
    image: ${DOCKER_USERNAME}/qr-attendance:latest
    container_name: qr-attendance-app
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      # Mount the database to persist data between deployments
      - ./attendance.db:/app/attendance.db
    networks:
      - webnet
  nginx:
    image: nginx:alpine
    container_name: qr-attendance-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - webnet
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email akashsuresh2027@cs.ajce.in -d system.duckdns.org --agree-tos

networks:
  webnet:
    driver: bridge
