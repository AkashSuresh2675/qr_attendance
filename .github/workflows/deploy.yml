name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    name: Build Docker Image & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKER_USERNAME }}/qr-attendance:latest

  deploy:
    name: Deploy to AWS EC2
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_USERNAME,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            # 1. Create directory structure on EC2
            mkdir -p ~/qr-attendance

            # 2. Re-create the docker-compose file (no Docker nginx - system nginx handles port 80/443)
            cat > ~/qr-attendance/docker-compose.yml << EOF
            version: "3.8"
            services:
              app:
                image: ${DOCKER_USERNAME}/qr-attendance:latest
                container_name: qr-app
                restart: unless-stopped
                ports:
                  - "5000:5000"
                environment:
                  - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
                  - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
                volumes:
                  - /home/${USER:-ubuntu}/qr-attendance/attendance.db:/app/attendance.db
            EOF

            # 3. Create an empty db file if it doesn't exist
            touch ~/qr-attendance/attendance.db

            # 4. Force stop ALL old containers regardless of how they were started
            docker stop qr-app qr-attendance-app qr-attendance-nginx || true
            docker rm   qr-app qr-attendance-app qr-attendance-nginx || true

            # Pull fresh image and restart containers
            docker pull ${DOCKER_USERNAME}/qr-attendance:latest
            cd ~/qr-attendance
            docker compose down || true
            docker compose pull
            docker compose up -d --force-recreate
            
            # 5. Clean up old unused images
            docker image prune -f
            
            echo "🚀 Deployment successfully completed on EC2!"
