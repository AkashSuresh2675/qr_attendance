name: Deploy Flask App to AWS

on:
  push:
    branches:
      - disabled-do-not-use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/qr-attendance .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/qr-attendance

      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "~/qr_attendance_system"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/qr_attendance_system

            # Export environment variables for docker compose
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"

            # FREE UP DISK SPACE: Remove stopped containers, old images, unused volumes
            docker system prune -af --volumes

            # Pull the latest app image
            docker pull ${{ secrets.DOCKER_USERNAME }}/qr-attendance

            # Create nginx config directory if needed
            mkdir -p ./nginx

            # Initialize a self-signed SSL cert if it doesn't exist yet so Nginx can start
            if [ ! -f "./certbot/conf/live/system.duckdns.org/privkey.pem" ]; then
              echo "Generating self-signed cert for first-time startup..."
              mkdir -p ./certbot/conf/live/system.duckdns.org
              mkdir -p ./certbot/www
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout "./certbot/conf/live/system.duckdns.org/privkey.pem" \
                -out "./certbot/conf/live/system.duckdns.org/fullchain.pem" \
                -subj "/CN=system.duckdns.org"
            fi

            # Start Nginx and App using the self-signed cert first
            docker compose up -d nginx app

            # Run Certbot to get a real Let's Encrypt certificate
            docker compose run --rm certbot certonly --webroot \
              -w /var/www/certbot \
              --email akashsuresh2027@cs.ajce.in \
              -d system.duckdns.org \
              --rsa-key-size 4096 \
              --agree-tos \
              --force-renewal

            # Reload Nginx to pick up the new real certificate
            docker compose exec nginx nginx -s reload

            # Ensure all services are up
            docker compose up -d
