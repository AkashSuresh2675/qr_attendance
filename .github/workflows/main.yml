name: Deploy Flask App to AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/qr-attendance .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/qr-attendance

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Ensure the directory exists
            mkdir -p ~/qr_attendance_system
            cd ~/qr_attendance_system
            
            # Export environment variables for docker-compose
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/qr-attendance
            
            # Initialize dummy SSL certificate if it doesn't exist so Nginx can start
            if [ ! -d "./certbot/conf/live/system.duckdns.org" ]; then
              echo "Initializing Let's Encrypt certificates for the first time..."
              mkdir -p ./certbot/conf/live/system.duckdns.org
              mkdir -p ./certbot/conf/archive/system.duckdns.org
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout "./certbot/conf/live/system.duckdns.org/privkey.pem" \
                -out "./certbot/conf/live/system.duckdns.org/fullchain.pem" \
                -subj "/CN=system.duckdns.org"
            fi
            
            # Start Nginx and App (which uses the dummy cert)
            docker-compose up -d nginx
            
            # Run certbot to replace the dummy cert with a real one
            docker-compose run --rm --entrypoint "\
              certbot certonly --webroot -w /var/www/certbot \
                --email akashsuresh2027@cs.ajce.in \
                -d system.duckdns.org \
                --rsa-key-size 4096 \
                --agree-tos \
                --force-renewal" certbot
            
            # Restart Nginx to load the new real certificate
            docker-compose restart nginx
            
            # Ensure all services are running properly
            docker-compose up -d
